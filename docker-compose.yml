name: bvc-frontend

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000/api}
    container_name: bvc-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - bvc-network

networks:
  bvc-network:
    name: bvc-network
    external: true
